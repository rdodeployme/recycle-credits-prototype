<script>
/* ============ CROSS-DEVICE HANDOFF (no server) =====================
   The member's QR is a URL carrying who they are. The counter opens it.
   After credits are issued the counter shows a claim QR the member's
   own camera opens, which applies the credits on their device.
   In the real product this happens over the network; offline we pass
   it device-to-device by QR.                                        */
function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ try{ s=s.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
function appOrigin(){ return location.origin + location.pathname; }

function visitLink(m){ const t=liveToken(m.id)||issueToken(m.id);
  return appOrigin()+'?v='+b64e({i:m.id,n:m.displayName,no:m.memberNo,s:m.shortCode,t:t.token}); }
function claimLink(tx){ const c=category(tx.categoryId);
  return appOrigin()+'?c='+b64e({k:tx.id,m:tx.memberId,n:member(tx.memberId).displayName,rc:tx.rc,cat:c.name,q:tx.qty,u:c.unit,kg:Math.round(tx.kg)}); }

/* a member who arrived by QR from another device */
function ensureVisitor(p){
  let m=S.members.find(x=>x.id===p.i) || S.members.find(x=>x.memberNo===p.no);
  if(!m){ m={ id:p.i, memberNo:p.no, displayName:p.n, email:'', mobile:'', postcode:'', walletType:'personal',
      status:'active', marketingOptIn:false, shortCode:p.s, source:'visiting', joinedAt:now(), visiting:true };
    S.members.push(m); }
  let t=S.tokens.find(x=>x.token===p.t);
  if(!t){ t={ id:uid('T'), memberId:m.id, token:p.t, issuedAt:now(), expiresAt:now()+S.settings.tokenMinutes*60000, usedAt:null };
    S.tokens.push(t); }
  else if(t.usedAt || t.expiresAt<=now()){ t.usedAt=null; t.expiresAt=now()+S.settings.tokenMinutes*60000; }
  save(); return {m,t};
}
function applyClaim(p){
  S.claimed = S.claimed || [];
  if(S.claimed.includes(p.k)) return { ok:false, msg:'Those credits are already in your wallet.' };
  let m = S.members.find(x=>x.id===p.m) || (S.ui.memberId ? member(S.ui.memberId) : null) || S.members[0];
  if(!m) return { ok:false, msg:'Join first, then scan the counter code.' };
  ledgerAdd(m.id,'EARN',p.rc,'Handoff',p.k, p.cat+' × '+p.q+(p.u==='kg'?' kg':''), 'counter');
  S.claimed.push(p.k);
  if(!S.transactions.some(t=>t.id===p.k)){
    const cat=S.categories.find(c=>c.name===p.cat)||S.categories[0];
    S.transactions.push({ id:p.k, at:now(), memberId:m.id, facilityId:'F1', operatorId:'O1', categoryId:cat.id,
      qty:p.q, baseRC:p.rc, campaignId:null, mult:1, rc:p.rc, kg:p.kg||0, status:'verified', flagReason:'', note:'via handoff' });
  }
  save(); return { ok:true, memberId:m.id, rc:p.rc, cat:p.cat };
}

/* ---- read the URL once on load ---- */
(function handleUrl(){
  const q=new URLSearchParams(location.search);
  const clean=()=>history.replaceState(null,'',appOrigin()+(q.get('explore')?'?explore=1':''));
  if(q.get('v')){
    const p=b64d(q.get('v'));
    if(p&&p.i){ const {t}=ensureVisitor(p);
      Object.assign(S.ui,{role:'counter',ctab:'scan',counterMember:{memberId:p.i,token:t.token,at:now()},counterCat:null,counterQty:1,counterResult:null});
      save(); clean(); window.__flash={msg:'QR scanned — '+p.n+' is loaded at the counter',kind:'ok'}; }
  } else if(q.get('c')){
    const p=b64d(q.get('c'));
    if(p&&p.k){ const r=applyClaim(p);
      Object.assign(S.ui,{role:'member',wtab:'home'});
      if(r.ok){ S.ui.memberId=r.memberId; S.ui.landed={memberId:r.memberId, rc:p.rc, cat:p.cat, qty:p.q, kg:p.kg||0, id:p.k}; }
      save(); clean(); window.__flash={msg: r.ok? ('+'+p.rc+' RC added to your wallet') : r.msg, kind: r.ok?'ok':'bad'}; }
  }
})();

/* ---- "what to try next" guidance ---- */
const NEXT=document.createElement('div');
NEXT.id='nextup'; NEXT.innerHTML='<div class="np"></div><button type="button" id="nuGo" hidden></button><button type="button" id="nuHide">Hide</button>';
document.body.appendChild(NEXT);
let guideOff=false; try{ guideOff = localStorage.getItem('rc-guide-off')==='1'; }catch(e){}
document.getElementById('nuHide').addEventListener('click',()=>{ guideOff=true; try{localStorage.setItem('rc-guide-off','1');}catch(e){} NEXT.classList.remove('on'); syncGuideSpace(); });
document.getElementById('nuGo').addEventListener('click',()=>{ const f=NEXT.__go; if(f) f(); });

function guidance(){
  const u=S.ui, m=u.memberId?member(u.memberId):null;
  if(u.role==='member'){
    if(!m) return {t:'Start here — create a wallet. It takes a name and an email, nothing else.'};
    if(u.wtab!=='qr' && balance(m.id)===0 && !S.transactions.some(t=>t.memberId===m.id))
      return {t:'Next: tap <b>Show my QR</b>, then scan it with another phone — or use the button under the QR to open the counter on this screen.',go:['Show my QR',()=>ui({wtab:'qr'})]};
    const off=activeOffers().sort((a,b)=>a.rcCost-b.rcCost);
    const can=off.filter(o=>o.rcCost<=balance(m.id));
    if(can.length && u.wtab!=='offers' && u.wtab!=='rewards')
      return {t:'You have enough credits. Next: open <b>Offers</b> and redeem one.',go:['Offers',()=>ui({wtab:'offers'})]};
    if(u.wtab==='rewards' && S.redemptions.some(r=>r.memberId===m.id&&r.status==='issued'))
      return {t:'Now switch to the <b>Store</b> page — your code is already waiting to be checked.',go:['Store',()=>setRole('retailer')]};
    if(balance(m.id)>0 && u.wtab!=='offers' && !can.length)
      return {t:'Credits are in. Recycle a couple more items at the counter to unlock a reward.'};
    return null;
  }
  if(u.role==='counter'){
    if(u.counterResult) return {t:'Credits issued. If the member is on another device, have them scan the code above. Otherwise switch back to <b>Customer</b>.',go:['Customer',()=>setRole('member')]};
    if(u.counterMember && !u.counterCat) return {t:'Pick what they brought in, set the quantity, then <b>Issue credits</b>.'};
    if(u.counterMember) return {t:'Set the quantity and tap <b>Issue credits</b>. Staff never type a credit amount.'};
    return {t:'Load a member: scan their QR with this device&rsquo;s camera, or tap one of the members already showing a QR.'};
  }
  if(u.role==='retailer'){
    if(u.rtab==='numbers') return {t:'This is what a store gets each month: every code traced to a sale, and what the rewards cost. <b>Download CSV</b> takes it with you.'};
    if(u.retailerCheck && u.retailerCheck.status==='valid') return {t:'Tap <b>Mark as used</b> to complete the redemption. Add a sale amount if you want it attributed.'};
    const pend=S.redemptions.filter(r=>r.status==='issued');
    if(pend.length) return {t:'A code is waiting — it is already filled in. Tap <b>Check</b>.'};
    return {t:'No live codes yet. Redeem an offer on the Customer side first — or open <b>Your numbers</b> to see a month of store activity.',go:['Customer',()=>setRole('member')]};
  }
  if(u.role==='admin'){
    if(S.transactions.some(t=>t.status==='flagged')) return {t:'There is a held transaction in the <b>Review queue</b> — approve or reject it with a reason.',go:['Review queue',()=>ui({atab:'review'})]};
    return {t:'Everything you just did is here: transactions, redemptions, the ledger and the audit log.'};
  }
  return null;
}
function syncGuideSpace(){
  const on=NEXT.classList.contains('on');
  document.documentElement.style.setProperty('--guide-h', on ? (NEXT.getBoundingClientRect().height+14)+'px' : '0px');
  document.body.classList.toggle('guide-on', on);
}
function paintGuide(){
  if(guideOff || WT.running){ NEXT.classList.remove('on'); syncGuideSpace(); return; }
  const g=guidance();
  if(!g){ NEXT.classList.remove('on'); syncGuideSpace(); return; }
  NEXT.querySelector('.np').innerHTML=g.t;
  const b=document.getElementById('nuGo');
  if(g.go){ b.hidden=false; b.textContent=g.go[0]; NEXT.__go=()=>{ g.go[1](); }; } else { b.hidden=true; NEXT.__go=null; }
  NEXT.classList.add('on');
  syncGuideSpace();
}

/* wrap render so guidance and handoff QR stay in sync */
(function(){
  const _r=window.render;
  window.render=function(){ _r();
    paintGuide();
    const box=document.getElementById('claimqr');
    if(box && S.ui.counterResult && S.ui.counterResult.tx){
      box.innerHTML='';
      const url=claimLink(S.ui.counterResult.tx);
      if(window.QRCode) new QRCode(box,{text:url,width:172,height:172,correctLevel:QRCode.CorrectLevel.M,colorDark:'#14302C',colorLight:'#FFFFFF'});
      else box.innerHTML='<div class="mono" style="font-size:.65rem;max-width:180px;word-break:break-all;color:#14302C">'+esc(url)+'</div>';
    }
  };
  if('ResizeObserver' in window){ new ResizeObserver(()=>syncGuideSpace()).observe(NEXT); }
  render();
  if(window.__flash){ toast(window.__flash.msg, window.__flash.kind); window.__flash=null; }
})();
</script>

@media (prefers-reduced-motion:no-preference){#landed.on .lbox{animation:land .45s cubic-bezier(.2,.9,.3,1.2)}@keyframes land{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}}

<script>
document.getElementById('brandHome').addEventListener('click', ()=>{ if(WT.running){ WT.abort=true; } setRole('start'); });

/* ===================== CSV ===================== */
function downloadCSV(text, name){
  try{ const blob=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },800); toast('CSV ready — '+name,'ok'); }
  catch(e){ toast('Could not build the CSV on this browser.','bad'); }
}

/* ===================== CREDITS LANDED ===================== */
const LAND=document.createElement('div'); LAND.id='landed'; LAND.setAttribute('role','status'); document.body.appendChild(LAND);
let landTimer=null;
function hideLanded(){ LAND.classList.remove('on'); if(landTimer){ clearTimeout(landTimer); landTimer=null; } }
LAND.addEventListener('click', hideLanded);
function showLanded(l){
  LAND.innerHTML=`<div class="lbox"><div class="lrc">+${l.rc}<small> RC</small></div><div class="lt">Credits landed</div><div class="ld">${esc(l.cat)} × ${l.qty}${l.kg?` · ${l.kg} kg kept out of landfill`:''}</div><div class="lk">Tap anywhere to continue</div></div>`;
  LAND.classList.add('on'); if(landTimer) clearTimeout(landTimer); landTimer=setTimeout(hideLanded, 4500);
}
(function(){
  const _r=window.render;
  window.render=function(){ _r();
    const l=S.ui.landed;
    if(l && WT.running){ S.ui.landed=null; save(); }
    else if(l && S.ui.role==='member' && S.ui.memberId===l.memberId){ S.ui.landed=null; save(); showLanded(l); }
  };
})();

/* ===================== INSTALL TO HOME SCREEN ===================== */

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#123A36"/><circle cx="256" cy="256" r="150" fill="none" stroke="#B9E675" stroke-width="34"/><path d="M256 150v212M180 226l76-76 76 76" fill="none" stroke="#B9E675" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const icon='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
  const manifest={ name:'Recycle Credits', short_name:'Recycle Credits', start_url: location.pathname+'?explore=1', display:'standalone', background_color:'#123A36', theme_color:'#123A36',
    icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'}] };
  const link=document.createElement('link'); link.rel='manifest'; link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest)); document.head.appendChild(link);
  const ti=document.createElement('link'); ti.rel='apple-touch-icon'; ti.href=icon; document.head.appendChild(ti);
  const fi=document.createElement('link'); fi.rel='icon'; fi.href=icon; document.head.appendChild(fi);
})();
render();
